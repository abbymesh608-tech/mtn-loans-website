<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTN Loans</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #ffcc00;
            padding: 22px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            color: #222;
        }

        .container {
            max-width: 450px;
            margin: 35px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0002;
        }

        h2 {
            text-align: center;
        }

        p {
            text-align: center;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            background: #ffcc00;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e6b800;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
        }
    </style>
</head>
<body>

<header>
    <h1>MTN LOANS</h1>
    <p>Welcome to MTN Loans</p>
</header>

<div class="container">
    <h2>Loan Application</h2>

    <p>Apply for a loan by entering your details below.</p>

    <form action="/apply" method="POST">

        <label>Full Name</label>
        <input type="text" name="name" required>

        <label>Phone Number</label>
        <input type="tel" name="phone" required>

        <label>Loan Amount</label>
        <input type="number" name="amount" required>

        <button type="submit">Submit Application</button>

    </form>
</div>

<footer>
    <p>© 2026 MTN Loans</p>
</footer>

</body>
</html>
